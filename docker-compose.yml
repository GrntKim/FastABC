services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fastabc
      POSTGRES_PASSWORD: fastabc
      POSTGRES_DB: fastabc
    ports:
      - "5432:5432"
    healthcheck:  # lets `docker compose up --wait` return only once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U fastabc"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
