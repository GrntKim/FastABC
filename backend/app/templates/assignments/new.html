{% extends "base.html" %}
{% block content %}
<h1>채점항목 추가</h1>
<form method="post" action="/exams/{{ exam.id }}/questions">
    <div id="items">
    {% for r in rows %}
    <fieldset>
        <input name="label" value="{{ r.label or '' }}" placeholder="항목 이름">
        <select name="kind">
        <option value="credit" {% if r.kind != 'deduction' %}selected{% endif %}>가점</option>
        <option value="deduction" {% if r.kind == 'deduction' %}selected{% endif %}>감점</option>
        </select>
        <input name="points" type="number" step="0.5" min="0.5" value="{{ r.points or '' }}" placeholder="배점">
        <textarea name="instructions" placeholder="AI가 확인할 내용">{{ r.instructions or '' }}</textarea>
    </fieldset>
    {% endfor %}
    </div>
</form>

<a href="/courses/{{ exam.course_id }}">뒤로 가기</a>

{% endblock %}
