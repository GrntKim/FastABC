{% extends "base.html" %}
{% block content %}
<h1>{{ exam.name }} 문항 추가</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/exams/{{ exam.id }}/problems">
    <div class="problem-form">
        <input name="number" value="{{ next_number }}" min="1" required placeholder="문제 번호">
        <input name="title" value="{{ title }}" placeholder="문제 제목" required>
        <textarea name="text" placeholder="문제 내용" required>{{ text }}</textarea>
    </div>
    <div id="criteria-form">
        <h2>채점 기준</h2>
        {% for r in rows %}
        <fieldset>
            <input name="label" value="{{ r.label or '' }}" placeholder="항목 이름">
            <select name="kind">
            <option value="credit" {% if r.kind != 'deduction' %}selected{% endif %}>가점</option>
            <option value="deduction" {% if r.kind == 'deduction' %}selected{% endif %}>감점</option>
            </select>
            <input name="points" type="number" step="0.5" min="0.5" value="{{ r.points or '' }}" placeholder="배점">
            <textarea name="instructions" placeholder="AI가 확인할 내용">{{ r.instructions or '' }}</textarea>
        </fieldset>
        {% endfor %}
    </div>
    <button>추가</button>
</form>

<a href="/courses/{{ exam.course_id }}">뒤로 가기</a>

{% endblock %}
