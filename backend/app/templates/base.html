<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FastABC{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='pico.classless.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <a href="/">FastABC</a>
    {% if user %}
      <span>{{ user.name }}</span>
      <form method="post" action="/logout"><button>로그아웃</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
