[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.143.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pandas>=3.0.6",
]
