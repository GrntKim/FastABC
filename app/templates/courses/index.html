{% extends "base.html" %}
{% block content %}
<h1>내 과목</h1>
<ul>
    {% for c in courses %}
    <li><a href="/courses/{{ c.id }}">{{ c.term | term_label }} · {{ c.department }} · {{ c.name }} ({{ c.section }}분반)</a>
    </li>
    {% else %}
    <li>아직 과목이 없습니다. 아래에서 추가하세요.</li>
    {% endfor %}
</ul>

<section class="add-course">
<h2>과목 추가</h2>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/courses">
    <input name="department" placeholder="학과" maxlength="100" required>
  <input name="year" type="number" min="2000" max="2100" value="2026" required>
  <select name="session">{% for v, label in sessions %}<option value="{{ v }}">{{ label }}</option>{% endfor %}</select>
  <input name="name" placeholder="과목명" maxlength="200" required>
  <input name="section" placeholder="분반" maxlength="20" required>
  <button>추가</button>
</form>
</section>
{% endblock %}
