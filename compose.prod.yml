# One server: Caddy (https) in front of the app (FastAPI renders every page), Postgres inside.
#   docker compose -f compose.prod.yml up -d --build
# Reads DOMAIN, POSTGRES_PASSWORD and the API keys from .env (see .env.example). Only ports 80 and 443 are open.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastabc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fastabc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastabc"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fastabc:${POSTGRES_PASSWORD}@db:5432/fastabc
      COOKIE_SECURE: "1"
      SIGNUP_OPEN: ${SIGNUP_OPEN:-0}
    volumes:
      - ./data:/app/data:ro # seed_demo.py reads data/eval and data/demo
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
